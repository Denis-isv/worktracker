{% extends "base.html" %}
{% block title %}Предложить план{% endblock %}
{% block content %}
<div class="page-header">
    <h1><i class="bi bi-briefcase me-2" style="color: var(--wt-primary);"></i>Предложить план на день</h1>
</div>

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="date" class="form-label"><i class="bi bi-calendar me-1"></i>Дата</label>
                        <input type="date" class="form-control" id="date" name="date" value="{{ form_data.date_str if form_data else default_date }}" required>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="is_day_off" name="is_day_off" {% if form_data and form_data.is_day_off %}checked{% endif %}>
                        <label class="form-check-label" for="is_day_off">Выходной</label>
                    </div>
                    <div class="row">
                        <div class="col">
                            <label for="start" class="form-label"><i class="bi bi-clock me-1"></i>Время прихода</label>
                            <input type="time" class="form-control" id="start" name="start" value="{{ form_data.start_str if form_data else '' }}">
                        </div>
                        <div class="col">
                            <label for="end" class="form-label"><i class="bi bi-clock-history me-1"></i>Время ухода</label>
                            <input type="time" class="form-control" id="end" name="end" value="{{ form_data.end_str if form_data else '' }}">
                        </div>
                    </div>
                    <div class="mt-3 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i>Сохранить план
                        </button>
                        <a href="{{ url_for('employee_dashboard') }}" class="btn btn-outline-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    const startInput = document.getElementById('start');
    const endInput = document.getElementById('end');

    startInput.addEventListener('change', function() {
        if (this.value && !endInput.value) {
            endInput.focus();
        }
    });

    startInput.addEventListener('input', function() {
        if (this.value.length === 5) {
            endInput.focus();
        }
    });
</script>
{% endblock %}
