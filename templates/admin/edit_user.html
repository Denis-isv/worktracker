{% extends "base.html" %}
{% block title %}Редактировать пользователя{% endblock %}
{% block content %}
<h2>Редактировать: {{ user.full_name }}</h2>
<form method="POST">
    <div class="mb-3">
        <label for="full_name" class="form-label">ФИО</label>
        <input type="text" class="form-control" id="full_name" name="full_name" value="{{ user.full_name }}" required>
    </div>
    <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
    </div>
    <div class="mb-3">
        <label for="password" class="form-label">Новый пароль (оставьте пустым, чтобы не менять)</label>
        <input type="password" class="form-control" id="password" name="password">
    </div>
    <div class="mb-3">
        <label for="role" class="form-label">Роль</label>
        <select class="form-select" id="role" name="role">
            <option value="employee" {% if user.role == 'employee' %}selected{% endif %}>Сотрудник</option>
            <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Администратор</option>
        </select>
    </div>
    <div class="mb-3">
        <label for="telegram_id" class="form-label">Telegram ID</label>
        <input type="text" class="form-control" id="telegram_id" name="telegram_id" value="{{ user.telegram_id or '' }}">
    </div>
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{{ url_for('admin_users') }}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
