{% extends "base.html" %}
{% block title %}Вход в систему{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card" style="padding: 2.5rem 2rem;">
            <div class="text-center mb-4">
                <div style="width: 70px; height: 70px; border-radius: 20px; background: linear-gradient(135deg, #4f46e5, #6366f1); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1rem;">
                    <i class="bi bi-clock-history" style="font-size: 2rem; color: white;"></i>
                </div>
                <h3 style="font-weight: 700; margin: 0;">Добро пожаловать</h3>
                <p style="color: var(--wt-text-muted); margin-top: 0.5rem;">Войдите в свою учётную запись</p>
            </div>
            <form method="POST">
                <div class="mb-3">
                    <label for="email" class="form-label">
                        <i class="bi bi-envelope me-1"></i>Email
                    </label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">
                        <i class="bi bi-lock me-1"></i>Пароль
                    </label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100" style="padding: 0.7rem;">
                    <i class="bi bi-box-arrow-in-right"></i>Войти
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
